function steps(){
  const L=[{t:"intro"}];
  L.push({t:"q",id:"p1"},{t:"multi",id:"p2"},{t:"q",id:"p3"},{t:"q",id:"p3b"});
  L.push({t:"multi",id:"p4"},{t:"q",id:"p5"},{t:"q",id:"p5b"},{t:"p6"});
  if(S.a.sexo==="mujer" && ["40_49","50_59","60"].includes(S.a.edad)) L.push({t:"q",id:"p6b"});
  L.push({t:"card",n:1});
  AX.E.items.forEach(id=>L.push({t:"q",id}));
  L.push({t:"micro",ax:"E"},{t:"card",n:2},{t:"q",id:"S0"});
  AX.S.items.forEach(id=>L.push({t:"q",id}));
  L.push({t:"micro",ax:"S"},{t:"card",n:3},{t:"q",id:"M0"});
  AX.M.items.forEach(id=>L.push({t:"q",id}));
  L.push({t:"micro",ax:"M"},{t:"card",n:4});
  AX.A.items.forEach(id=>L.push({t:"q",id}));
  L.push({t:"micro",ax:"A"},{t:"card",n:5},{t:"capture"},{t:"result"});
  return L;
}

/* =========================================================
   PUNTUACIÓN
   ========================================================= */
function score(ax){
  let s=AX[ax].items.reduce((t,i)=>t+v(i),0);
  if(ax==="S" && S.a.S0==="lt6") s=Math.min(12,s+2);
  return s;
}
function level(ax){ const sc=score(ax),m=AX[ax].max; return sc<=m/3?"verde":sc<=2*m/3?"ambar":"rojo"; }
const alert=ax=>level(ax)!=="verde";
const high=id=>v(id)>=2;
function sobrecarga(){ return S.a.M0==="5plus" && alert("E") && (high("M2")||high("M4")); }

function compute(){
  const sc={},lv={},pct={};
  ORDER.forEach(k=>{sc[k]=score(k);lv[k]=level(k);pct[k]=sc[k]/AX[k].max;});
  const pp=ORDER.find(k=>lv[k]!=="verde")||null;
  let mc=ORDER[0]; ORDER.forEach(k=>{ if(pct[k]>pct[mc]) mc=k; });
  if(lv[mc]==="verde") mc=null;
  const nAlert=ORDER.filter(k=>lv[k]!=="verde").length;
  const aES=lv.E!=="verde"||lv.S!=="verde";
  let perfil;
  if(lv.E==="rojo"&&lv.S==="rojo") perfil="supervivencia";
  else if(sobrecarga()) perfil="sobrecarga";
  else if(aES && high("A2") && lv.A!=="verde") perfil="ciclo_dietas";
  else if((lv.E==="rojo"||lv.S==="rojo") && lv.M==="verde" && lv.A==="verde") perfil="todo_bien";
  else if(nAlert>=3) perfil="varios_ejes";
  else if(aES) perfil="alerta";
  else if(nAlert>=1) perfil="freno_puntual";
  else perfil="en_orden";
  const tried=(S.a.p4||[]).filter(x=>x!=="nada");
  const triedDietOrTrain=tried.some(x=>["dietas","ayuno","gym","nutri","entrenador"].includes(x));
  const profHigh=["dirijo","autonomo"].includes(S.a.p5)||["6_20","gt20"].includes(S.a.p5b);
  const icp=profHigh && aES && triedDietOrTrain;
  return {sc,lv,pct,pp,mc,perfil,icp,aES,tried,sobrecarga:sobrecarga()};
}

/* síntomas ordenados de E y S (para bloque ICP) */
function esSymptoms(n){
  const list=[...AX.E.items,...AX.S.items].map(id=>({id,s:v(id)}));
  if(S.a.S0==="lt6") list.push({id:"S0",s:2.5});
  let top=list.filter(x=>x.s>=2).sort((a,b)=>b.s-a.s);
  if(top.length<2) top=list.filter(x=>x.s>=1).sort((a,b)=>b.s-a.s);
  return top.slice(0,n).map(x=>SHORT[x.id]());
}
function allSymptoms(max){
  const out=[];
  ORDER.forEach(k=>{
    if(k==="S"&&S.a.S0==="lt6") out.push(SYM.S0());
    AX[k].items.forEach(id=>{ if(high(id)) out.push(SYM[id]()); });
  });
  return out.slice(0,max);
}

const app=document.getElementById("app");
function topbar(){
  const L=steps(), p=S.idx/(L.length-2);
  return `<div class="top"><div class="top-row">
    <button class="back" onclick="back()" aria-label="Volver" ${S.idx<=1?"hidden":""}>← Atrás</button>
    <span class="brand">The Health Dealer · SSE</span>
  </div><div class="track"><div class="fill" id="fill"></div></div></div>
  <span hidden data-p="${Math.min(1,p)}"></span>`;
}
function setFill(){ const el=document.getElementById("fill"),d=document.querySelector("[data-p]"); if(el&&d) requestAnimationFrame(()=>{el.style.transform=`scaleX(${d.dataset.p})`;}); }

function render(){
  const st=steps()[S.idx];
  let h="";
  if(st.t==="intro") h=viewIntro();
  else if(st.t==="q") h=topbar()+viewQ(st.id);
  else if(st.t==="multi") h=topbar()+viewMulti(st.id);
  else if(st.t==="p6") h=topbar()+viewP6();
  else if(st.t==="micro") h=topbar()+viewMicro(st.ax);
  else if(st.t==="card") h=topbar()+viewCard(st.n);
  else if(st.t==="capture") h=topbar()+viewCapture();
  else if(st.t==="result") h=viewResult();
  const body=h.replace(/<div class="top">[\s\S]*?<\/div><\/div>/,"");
  if(st.t!=="intro" && /SSE/.test(body)) h+=`<p class="sse-note">SSE: Sistema de Sincronización Energética</p>`;
  app.innerHTML=`<div class="screen">${h}</div>`;
  setFill();
  window.scrollTo({top:0});
  if(st.t==="result") requestAnimationFrame(()=>setTimeout(()=>document.querySelectorAll(".bar i").forEach(b=>b.style.transform=`scaleX(${b.dataset.w})`),120));
}
function next(){ S.idx=Math.min(S.idx+1,steps().length-1); render(); }
function back(){ if(S.idx>0){ S.idx--; render(); } }

function blockLabel(b){
  return b===0?`<div class="block"><b>Antes de empezar</b> · ${BLOCKS[0]}</div>`:`<div class="block"><b>Bloque ${b} de 4</b> · ${BLOCKS[b]}</div>`;
}

function start(){ track("TestSSE_Start"); next(); }

function viewQ(id){
  const q=Q[id], txt=typeof q.t==="function"?q.t():q.t, cur=S.a[id];
  let opts;
  if(q.s){
    opts=SCALE.map(([val,l])=>`<button class="opt ${cur===val?"sel":""}" onclick="pick('${id}',${val},this)"><span class="tick"></span>${l}<span class="lvl">${[1,2,3].map(n=>`<i class="${n<=val?"on":""}"></i>`).join("")}</span></button>`).join("");
  } else {
    opts=q.o.map(([val,l])=>`<button class="opt ${cur===val?"sel":""}" onclick="pick('${id}','${val}',this)"><span class="tick"></span>${l}</button>`).join("");
  }
  const otro=(id==="p5"&&cur==="otro")?`<div class="field" style="margin-top:14px"><label for="p5o">¿A qué te dedicas?</label><input class="input" id="p5o" value="${esc(S.a.p5_otro||"")}" oninput="S.a.p5_otro=this.value;document.getElementById('p5c').disabled=!this.value.trim()" placeholder="Escríbelo aquí"></div><button class="cta" id="p5c" ${(S.a.p5_otro||"").trim()?"":"disabled"} onclick="next()">Continuar <span class="arr">→</span></button>`:"";
  return `<div class="qhead">${blockLabel(q.b)}
    <div class="statement">${txt}</div>
    ${q.s?`<div class="hint">¿Con qué frecuencia te pasa?</div>`:q.h?`<div class="hint">${q.h}</div>`:""}
  </div><div class="opts stagger">${opts}</div>${otro}`;
}
function pick(id,val,el){
  S.a[id]=val;
  document.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
  el.classList.add("sel");
  if(id==="p5"&&val==="otro"){ render(); setTimeout(()=>{const i=document.getElementById("p5o"); if(i) i.focus();},80); return; }
  setTimeout(next,260);
}
function viewMulti(id){
  const q=Q[id], cur=S.a[id]||[];
  const opts=q.o.map(([val,l])=>`<button class="opt multi ${cur.includes(val)?"sel":""}" onclick="toggleMulti('${id}','${val}')"><span class="tick"></span>${l}</button>`).join("");
  return `<div class="qhead">${blockLabel(q.b)}<div class="statement">${q.t}</div><div class="hint">${q.h}</div></div>
  <div class="opts stagger">${opts}</div>
  <div class="sticky-cta"><button class="cta" ${cur.length?"":"disabled"} onclick="next()">Continuar <span class="arr">→</span></button></div>`;
}
function toggleMulti(id,val){
  let cur=S.a[id]||[];
  if(id==="p4"&&val==="nada") cur=cur.includes("nada")?[]:["nada"];
  else { cur=cur.filter(x=>x!=="nada"); cur=cur.includes(val)?cur.filter(x=>x!==val):[...cur,val]; }

function icpParas(R){
  const tried=join(R.tried.map(x=>P4TXT[x]));
  const P3B={nada:"Y aun así, no consigues bajar.",estanco:"Y cuando bajas, son 1-2 kg con muchísimo esfuerzo y te estancas.",recupero:"Y cuando bajas, lo recuperas en pocas semanas.",mantengo:"Y cuando bajas, lo mantienes, pero cada kilo te cuesta un mundo."};

  return [
    `${S.form.nombre}, has probado ${tried}. Has puesto esfuerzo. ${P3B[S.a.p3b]||""}`.trim(),
    `Tus respuestas muestran un sistema nervioso que lleva tiempo en alerta: ${join(esSymptoms(3))}.`,
    closing,
    "Por eso en el SSE empezamos por el estrés y el sueño. La dieta y el entreno funcionan cuando el cuerpo deja de estar en modo supervivencia."

function crossParas(R){

  const train=R.tried.filter(x=>["gym","entrenador"].includes(x)).map(x=>P4TXT[x]);
  const L=[];
  if(diet.length&&R.lv.S!=="verde") L.push(`Probaste ${join(diet)} con el sueño ${LVLTXT[R.lv.S]}. La dieta trabajaba cuesta arriba: dormir mal suele subir el hambre y hacer que se pierda menos grasa.`);

  if(train.length&&R.lv.E!=="verde") L.push(`Entrenaste con el sistema nervioso en alerta. Para un cuerpo saturado, más entreno puede ser más carga.`);
  if(!L.length&&!R.aES&&R.pp) L.push(`Probaste ${join(R.tried.map(x=>P4TXT[x]))}. Tu estrés y tu sueño están en buen sitio, así que tenías el terreno a favor. El freno parece estar en ${AX[R.pp].art}.`);

function porqueCorto(R){

    ctaBlock=`<h3>Reserva una llamada para ver tu caso</h3>
      <p>En la llamada repasamos tus respuestas y te enseño en qué orden trabajaría tu caso, y por qué.</p>
      <p class="muted small">Si lo prefieres, te escribimos por WhatsApp en un rato para cuadrar la hora.</p>
      ${cal}${vsl}`;
  } else {
    ctaBlock=`<h3>${R.aES?"Cuando tengas un rato, mira esto":"Si quieres saber más"}</h3>
      <p>En este vídeo explico por qué el SSE empieza por el estrés y el sueño, y qué cambia cuando se respeta el orden.</p>
      ${vsl}<p class="muted small" style="margin-top:12px">Te iremos enviando más cosas por email.</p>`;
  }

  return `<section class="stagger">
    <div class="res-head"><p class="eyebrow">Tu resultado SSE</p>
      <h1>${nombre}, tu perfil es<span class="prof">${P.n}</span></h1>
      <p class="muted" style="margin-top:14px;font-size:18px">${line}</p></div>
    <div class="shell map"><div class="core">${map}</div></div>
    ${R.icp?icpBlock(R):crossBlock(R)}
    ${honest}
    ${symBlock}
    ${orderBlock}
    ${caseBlock}
    ${goal}
    <div class="section final"><div class="shell"><div class="core">${ctaBlock}</div></div></div>
    <p class="small muted">Te enviamos una copia de tu resultado a ${esc(f.email)}.</p>
    <p class="foot">Este test es una herramienta orientativa basada en tus respuestas. No es un diagnóstico médico ni sustituye la consulta con un profesional sanitario. Si tienes síntomas que te preocupan, consulta con tu médico.</p>
  </section>`;
}

/* =========================================================
   DATOS → Systeme.io (vía endpoint seguro) + aviso a setter
   ========================================================= */
function origin(){
  const p=new URLSearchParams(location.search), ref=document.referrer||"";
  let fuente=p.get("utm_source")||p.get("origen")||"";
  if(!fuente){ if(/youtu/.test(ref)) fuente="youtube"; else if(/instagram/.test(ref)) fuente="instagram"; else if(p.get("fbclid")) fuente="ads"; else fuente="directo"; }
  return {fuente:fuente.toLowerCase(),utm_source:p.get("utm_source")||"",utm_medium:p.get("utm_medium")||"",utm_campaign:p.get("utm_campaign")||"",utm_content:p.get("utm_content")||"",video:p.get("video")||p.get("v")||p.get("utm_content")||"",referrer:ref,url:location.href};
}
function label(id,val){
  if(id==="edad") return (EDADES.find(x=>x[0]===val)||[])[1]||"";
  if(id==="sexo") return (SEXOS.find(x=>x[0]===val)||[])[1]||"";
  const q=Q[id]; if(!q) return val;
  if(q.s) return SCALE[val]?SCALE[val][1]:"";
  if(q.multi) return (val||[]).map(x=>(q.o.find(o=>o[0]===x)||[])[1]).join(", ");
  return (q.o.find(o=>o[0]===val)||[])[1]||"";
}
function saveLead(){
  const R=S.R=compute(), f=S.form, o=origin();
  const k=x=>x?AX[x].key:"ninguno";
  const tags=["test_sse",
    `eje_punto_partida_${k(R.pp)}`,`eje_mas_cargado_${k(R.mc)}`,`perfil_resultado_${R.perfil}`,
    `kg_objetivo_${S.a.p1}`,`tiempo_intentandolo_${S.a.p3}`,`bajada_${S.a.p3b}`,
    `perfil_profesional_${S.a.p5}`,`equipo_${S.a.p5b}`,
    `intencion_${f.intencion}`,`icp_${R.icp?"si":"no"}`,`origen_${o.fuente}`,
    `emails_${f.c2?"si":"no"}`];
  tags.push(`alerta_${R.aES?"si":"no"}`);
  if(R.sobrecarga) tags.push("flag_sobrecarga");
  if(S.a.p6b==="si") tags.push("perimenopausia_si");
  const respuestas={};
  ["p1","p2","p3","p3b","p4","p5","p5b","edad","sexo","p6b","S0","M0",...AX.E.items,...AX.S.items,...AX.M.items,...AX.A.items]
    .forEach(id=>{ if(S.a[id]!==undefined) respuestas[id]=label(id,S.a[id]); });
  if(S.a.p5==="otro"&&S.a.p5_otro) respuestas.p5=`Otro: ${S.a.p5_otro}`;
  const resumen=[
    `${R.icp?"🔥 ICP SÍ":"ICP no"} · intención ${f.intencion.toUpperCase()}`,
    `${f.nombre} · ${f.telefono} · ${f.email}`,
    `Perfil: ${PERFILES[R.perfil].n} · Punto de partida: ${R.pp?AX[R.pp].name:"—"} · Más cargado: ${R.mc?AX[R.mc].name:"—"}`,
    `Estrés ${R.sc.E}/18 · Sueño ${R.sc.S}/12 · Movimiento ${R.sc.M}/12 · Alimentación ${R.sc.A}/12`,
    `Quiere perder: ${respuestas.p1} · Lleva: ${respuestas.p3}`,
    `Cuando baja: ${respuestas.p3b}`,
    `Ha probado: ${respuestas.p4}`,
    `Trabajo: ${respuestas.p5} · Dependen de él/ella: ${respuestas.p5b}`,
    `Le molesta: ${respuestas.p2}`,
    `Síntomas: ${allSymptoms(5).join("; ")}`,
    `Origen: ${o.fuente}${o.video?" · "+o.video:""}`
  ].join("\n");
  const payload={
    nombre:f.nombre,email:f.email,telefono:f.telefono,
    consentimiento_salud:true,consentimiento_marketing:!!f.c2,intencion:f.intencion,
    icp:R.icp,perfil:R.perfil,perfil_nombre:PERFILES[R.perfil].n,
    eje_punto_partida:k(R.pp),eje_mas_cargado:k(R.mc),
    puntuaciones:{estres:R.sc.E,sueno:R.sc.S,movimiento:R.sc.M,alimentacion:R.sc.A},
    niveles:{estres:R.lv.E,sueno:R.lv.S,movimiento:R.lv.M,alimentacion:R.lv.A},
    respuestas,tags,origen:o,resumen_setter:resumen,timestamp:new Date().toISOString(),
    campos_email:{
      perfil:PERFILES[R.perfil].n,
      perfil_frase:R.perfil==="freno_puntual"?"Tu estrés y tu sueño están en buen sitio.":PERFILES[R.perfil].l,
      punto_partida:R.pp?AX[R.pp].art:"",
      parrafo_porque:porqueCorto(R),
      ...emailBloques(R),
      cta_texto:(f.intencion==="si"&&R.aES)?"Reservar mi llamada":"Ver el vídeo",
      cta_url:(f.intencion==="si"&&R.aES)?CONFIG.CALENDLY_URL:CONFIG.VSL_URL
    },
    website:f.hp||""
  };
  S.lead=payload;
  if(!CONFIG.LEAD_ENDPOINT){ console.info("LEAD_ENDPOINT vacío. Payload:",payload); return; }
  try{
    fetch(CONFIG.LEAD_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),keepalive:true}).catch(e=>console.warn("Lead no enviado",e));
  }catch(e){ console.warn("Lead no enviado",e); }
}
function track(ev){ try{ if(window.fbq) ev==="Lead"?fbq("track","Lead"):fbq("trackCustom",ev); }catch(e){} }

render();
